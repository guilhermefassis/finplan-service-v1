openapi: 3.0.3
info:
  title: Financial Planning API
  version: 1.0.0
  description: >
    First version of the personal financial planning API.
    Focus on expense/income registration and monthly balance.

servers:
  - url: /api/v1

paths:
  /users:
    post:
      summary: Create a new user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, paymentFrequency]
              properties:
                name:
                  type: string
                  example: "John Doe"
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                paymentFrequency:
                  type: string
                  enum: [MONTHLY, BIWEEKLY, WEEKLY, DAILY]
                paymentDetails:
                  type: object
                  nullable: true
                  description: "Details about payment schedule"
                  example:
                    dayOfMonth: 5
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  email:
                    type: string
                  paymentFrequency:
                    type: string
                    enum: [MONTHLY, BIWEEKLY, WEEKLY, DAILY]
                  paymentDetails:
                    type: object
                    nullable: true
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time

  /users/{id}:
    get:
      summary: Get user details
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  email:
                    type: string
                  paymentFrequency:
                    type: string
                    enum: [MONTHLY, BIWEEKLY, WEEKLY, DAILY]
                  paymentDetails:
                    type: object
                    nullable: true
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
        '404':
          description: User not found

  /credit-cards:
    post:
      summary: Create a new credit card
      tags: [CreditCards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, name, closingDay, dueDay]
              properties:
                userId:
                  type: string
                  format: uuid
                name:
                  type: string
                  example: "Nubank"
                brand:
                  type: string
                  example: "Mastercard"
                closingDay:
                  type: integer
                  minimum: 1
                  maximum: 31
                  example: 10
                dueDay:
                  type: integer
                  minimum: 1
                  maximum: 31
                  example: 17
                creditLimit:
                  type: number
                  format: double
                  nullable: true
                  example: 5000.00
      responses:
        '201':
          description: Credit card created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  userId:
                    type: string
                    format: uuid
                  name:
                    type: string
                  brand:
                    type: string
                  closingDay:
                    type: integer
                  dueDay:
                    type: integer
                  creditLimit:
                    type: number
                    format: double
                    nullable: true
                  active:
                    type: boolean
                  createdAt:
                    type: string
                    format: date-time

    get:
      summary: List user's credit cards
      tags: [CreditCards]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of credit cards
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    userId:
                      type: string
                      format: uuid
                    name:
                      type: string
                    brand:
                      type: string
                    closingDay:
                      type: integer
                    dueDay:
                      type: integer
                    creditLimit:
                      type: number
                      format: double
                      nullable: true
                    active:
                      type: boolean
                    createdAt:
                      type: string
                      format: date-time

  /credit-cards/{id}:
    get:
      summary: Get credit card details
      tags: [CreditCards]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Credit card found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  userId:
                    type: string
                    format: uuid
                  name:
                    type: string
                  brand:
                    type: string
                  closingDay:
                    type: integer
                  dueDay:
                    type: integer
                  creditLimit:
                    type: number
                    format: double
                    nullable: true
                  active:
                    type: boolean
                  createdAt:
                    type: string
                    format: date-time
        '404':
          description: Credit card not found

    put:
      summary: Update credit card
      tags: [CreditCards]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                brand:
                  type: string
                closingDay:
                  type: integer
                  minimum: 1
                  maximum: 31
                dueDay:
                  type: integer
                  minimum: 1
                  maximum: 31
                creditLimit:
                  type: number
                  format: double
                active:
                  type: boolean
      responses:
        '200':
          description: Credit card updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  userId:
                    type: string
                    format: uuid
                  name:
                    type: string
                  brand:
                    type: string
                  closingDay:
                    type: integer
                  dueDay:
                    type: integer
                  creditLimit:
                    type: number
                    format: double
                    nullable: true
                  active:
                    type: boolean
                  createdAt:
                    type: string
                    format: date-time

    delete:
      summary: Delete credit card
      tags: [CreditCards]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Credit card deleted

  /credit-cards/{cardId}/transactions:
    post:
      summary: Create a credit card transaction
      tags: [CreditCardTransactions]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchaseDate, description, amount]
              properties:
                purchaseDate:
                  type: string
                  format: date
                  example: "2026-01-02"
                description:
                  type: string
                  example: "Supermarket"
                category:
                  type: string
                  example: "GROCERIES"
                amount:
                  type: number
                  format: double
                  example: 250.00
                installments:
                  type: boolean
                  example: false
                totalInstallments:
                  type: integer
                  nullable: true
                  minimum: 2
                  example: 3
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  creditCardId:
                    type: string
                    format: uuid
                  invoiceId:
                    type: string
                    format: uuid
                    nullable: true
                  purchaseDate:
                    type: string
                    format: date
                  description:
                    type: string
                  category:
                    type: string
                  amount:
                    type: number
                    format: double
                  installments:
                    type: boolean
                  totalInstallments:
                    type: integer
                    nullable: true
                  currentInstallment:
                    type: integer
                    nullable: true
                  createdAt:
                    type: string
                    format: date-time

    get:
      summary: List credit card transactions
      tags: [CreditCardTransactions]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: month
          in: query
          required: false
          description: Reference month in YYYY-MM format
          schema:
            type: string
            example: "2026-01"
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    creditCardId:
                      type: string
                      format: uuid
                    invoiceId:
                      type: string
                      format: uuid
                      nullable: true
                    purchaseDate:
                      type: string
                      format: date
                    description:
                      type: string
                    category:
                      type: string
                    amount:
                      type: number
                      format: double
                    installments:
                      type: boolean
                    totalInstallments:
                      type: integer
                      nullable: true
                    currentInstallment:
                      type: integer
                      nullable: true
                    createdAt:
                      type: string
                      format: date-time

  /credit-cards/{cardId}/invoices:
    get:
      summary: List credit card invoices
      tags: [CreditCardInvoices]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: startMonth
          in: query
          required: false
          description: Start month in YYYY-MM format
          schema:
            type: string
            example: "2026-01"
        - name: endMonth
          in: query
          required: false
          description: End month in YYYY-MM format
          schema:
            type: string
            example: "2026-12"
      responses:
        '200':
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    creditCardId:
                      type: string
                      format: uuid
                    referenceMonth:
                      type: string
                      format: date
                      example: "2026-01-01"
                    closingDate:
                      type: string
                      format: date
                    dueDate:
                      type: string
                      format: date
                    totalAmount:
                      type: number
                      format: double
                    status:
                      type: string
                      enum: [OPEN, CLOSED, PAID]
                    paymentDate:
                      type: string
                      format: date
                      nullable: true

  /credit-cards/{cardId}/invoices/{invoiceId}:
    get:
      summary: Get invoice details with transactions
      tags: [CreditCardInvoices]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invoice details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  creditCardId:
                    type: string
                    format: uuid
                  referenceMonth:
                    type: string
                    format: date
                  closingDate:
                    type: string
                    format: date
                  dueDate:
                    type: string
                    format: date
                  totalAmount:
                    type: number
                    format: double
                  status:
                    type: string
                    enum: [OPEN, CLOSED, PAID]
                  paymentDate:
                    type: string
                    format: date
                    nullable: true
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        purchaseDate:
                          type: string
                          format: date
                        description:
                          type: string
                        category:
                          type: string
                        amount:
                          type: number
                          format: double
                        installments:
                          type: boolean
                        totalInstallments:
                          type: integer
                          nullable: true
                        currentInstallment:
                          type: integer
                          nullable: true

    patch:
      summary: Update invoice status
      tags: [CreditCardInvoices]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [OPEN, CLOSED, PAID]
                paymentDate:
                  type: string
                  format: date
                  nullable: true
      responses:
        '200':
          description: Invoice status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  creditCardId:
                    type: string
                    format: uuid
                  referenceMonth:
                    type: string
                    format: date
                  closingDate:
                    type: string
                    format: date
                  dueDate:
                    type: string
                    format: date
                  totalAmount:
                    type: number
                    format: double
                  status:
                    type: string
                    enum: [OPEN, CLOSED, PAID]
                  paymentDate:
                    type: string
                    format: date
                    nullable: true

  /fixed-expenses:
    post:
      summary: Create a fixed expense
      tags: [FixedExpenses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, name, amount, dueDay]
              properties:
                userId:
                  type: string
                  format: uuid
                name:
                  type: string
                  example: "Rent"
                category:
                  type: string
                  example: "HOUSING"
                amount:
                  type: number
                  format: double
                  example: 1500.00
                dueDay:
                  type: integer
                  minimum: 1
                  maximum: 31
                  example: 5
                recurrence:
                  type: string
                  enum: [MONTHLY, ANNUAL]
                paymentMethod:
                  type: string
                  example: "BANK_DEBIT"
      responses:
        '201':
          description: Fixed expense created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  userId:
                    type: string
                    format: uuid
                  name:
                    type: string
                  category:
                    type: string
                  amount:
                    type: number
                    format: double
                  dueDay:
                    type: integer
                  recurrence:
                    type: string
                    enum: [MONTHLY, ANNUAL]
                  paymentMethod:
                    type: string
                  active:
                    type: boolean
                  createdAt:
                    type: string
                    format: date-time

    get:
      summary: List user's fixed expenses
      tags: [FixedExpenses]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: active
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: List of fixed expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    userId:
                      type: string
                      format: uuid
                    name:
                      type: string
                    category:
                      type: string
                    amount:
                      type: number
                      format: double
                    dueDay:
                      type: integer
                    recurrence:
                      type: string
                      enum: [MONTHLY, ANNUAL]
                    paymentMethod:
                      type: string
                    active:
                      type: boolean
                    createdAt:
                      type: string
                      format: date-time

  /fixed-expenses/{id}:
    get:
      summary: Get fixed expense details
      tags: [FixedExpenses]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fixed expense found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  userId:
                    type: string
                    format: uuid
                  name:
                    type: string
                  category:
                    type: string
                  amount:
                    type: number
                    format: double
                  dueDay:
                    type: integer
                  recurrence:
                    type: string
                    enum: [MONTHLY, ANNUAL]
                  paymentMethod:
                    type: string
                  active:
                    type: boolean
                  createdAt:
                    type: string
                    format: date-time

    put:
      summary: Update fixed expense
      tags: [FixedExpenses]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                category:
                  type: string
                amount:
                  type: number
                  format: double
                dueDay:
                  type: integer
                  minimum: 1
                  maximum: 31
                recurrence:
                  type: string
                  enum: [MONTHLY, ANNUAL]
                paymentMethod:
                  type: string
                active:
                  type: boolean
      responses:
        '200':
          description: Fixed expense updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  userId:
                    type: string
                    format: uuid
                  name:
                    type: string
                  category:
                    type: string
                  amount:
                    type: number
                    format: double
                  dueDay:
                    type: integer
                  recurrence:
                    type: string
                    enum: [MONTHLY, ANNUAL]
                  paymentMethod:
                    type: string
                  active:
                    type: boolean
                  createdAt:
                    type: string